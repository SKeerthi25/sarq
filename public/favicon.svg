<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="sarqRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#C51E42" />
      <stop offset="50%" stopColor="#A81332" />
      <stop offset="100%" stopColor="#68091B" />
    </linearGradient>
    <linearGradient id="sarqShadowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#4A0512" />
      <stop offset="100%" stopColor="#870B24" />
    </linearGradient>
    <linearGradient id="sarqAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#E0F548" />
      <stop offset="100%" stopColor="#C3D63F" />
    </linearGradient>
    <linearGradient id="sarqShieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#22252A" />
      <stop offset="100%" stopColor="#141618" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Architectural Shield -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="url(#sarqShieldGrad)" stroke="url(#sarqRedGrad)" stroke-width="4" stroke-linejoin="round" />

  <!-- Top Beam of S -->
  <path d="M 28 32 L 72 32 L 64 43 L 36 43 Z" fill="url(#sarqRedGrad)" />
  <polygon points="72,32 64,43 78,43 82,32" fill="url(#sarqAccentGrad)" />

  <!-- Left Column -->
  <path d="M 28 32 L 36 43 L 36 57 L 24 51 Z" fill="url(#sarqShadowGrad)" />

  <!-- Center Cross-Beam -->
  <path d="M 28 49 L 72 49 L 64 60 L 22 60 Z" fill="url(#sarqRedGrad)" />
  <polygon points="50,44 54,49 46,49" fill="url(#sarqAccentGrad)" />

  <!-- Right Column -->
  <path d="M 64 60 L 76 54 L 76 68 L 64 68 Z" fill="url(#sarqShadowGrad)" />

  <!-- Bottom Beam -->
  <path d="M 28 68 L 76 68 L 68 79 L 20 79 Z" fill="url(#sarqRedGrad)" />
  <polygon points="20,79 28,68 18,68 12,79" fill="url(#sarqAccentGrad)" />

  <!-- Rivets -->
  <circle cx="50" cy="11" r="2.5" fill="#C3D63F" />
  <circle cx="50" cy="89" r="2.5" fill="#C3D63F" />
</svg>
